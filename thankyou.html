<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank you | Jewel Basin Insurance Solutions</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background: #edf3f6;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      max-width: 520px;
      width: 100%;
      border-radius: 16px;
      padding: 2.5rem 2.25rem 2rem;
      text-align: center;
      box-shadow: 0 20px 45px rgba(13,59,102,0.06);
    }
    .card h1 {
      margin-bottom: 0.75rem;
      color: #0D3B66;
    }
    .card p {
      margin-bottom: 1.4rem;
      color: #264653;
    }
    .btn-primary {
      background: #0D3B66;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 0.6rem 1.25rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary:hover {
      background: #1E6091;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Thank you!</h1>
    <p>Your request has been submitted. A licensed broker from Jewel Basin Insurance Solutions LLC will be contacting you shortly.</p>
    <p style="font-size: .8rem; color: rgba(38,70,83,.7);">
      If this was submitted in error, simply ignore this message.
    </p>
    <a href="/" class="btn-primary">Return to website</a>
  </div>
</body>
</html>
